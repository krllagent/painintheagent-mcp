name: Release MCP bundle and registry metadata
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'krllagent/painintheagent-mcp' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and verify the client
        run: |
          npm run build
          npm test
          node scripts/package.mjs
          node scripts/verify-package.mjs
      - name: Resolve the release tag
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const {version}=JSON.parse(fs.readFileSync("package.json","utf8")); if(!/^\d+\.\d+\.\d+$/.test(version)) throw Error("Invalid version"); fs.appendFileSync(process.env.GITHUB_ENV, "RELEASE_TAG=v"+version+"\n");'
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Pain in the Agent MCP $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" artifacts/*.mcpb artifacts/SHA256SUMS server.json --clobber
      - name: Install the pinned MCP publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz -o publisher.tar.gz
          printf '%s\n' 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Authenticate to the official MCP Registry
        run: |
          ./mcp-publisher login github-oidc > "$RUNNER_TEMP/mcp-login.txt" 2>&1 || {
            python3 scripts/registry-error.py "$RUNNER_TEMP/mcp-login.txt"
            exit 1
          }
      - name: Publish to the official MCP Registry
        run: |
          ./mcp-publisher publish > "$RUNNER_TEMP/mcp-publish.txt" 2>&1 || {
            python3 scripts/registry-error.py "$RUNNER_TEMP/mcp-publish.txt"
            exit 1
          }
